---
- name: Install and configure Zabbix Agent 2 on Linux
  hosts: linux
  become: true
  vars:
    zabbix_server_ip: 192.168.88.50
    zabbix_release_deb: https://repo.zabbix.com/zabbix/7.0/ubuntu/pool/main/z/zabbix-release/zabbix-release_latest_7.0+ubuntu24.04_all.deb

  tasks:
    - name: Install Zabbix repository package
      ansible.builtin.apt:
        deb: "{{ zabbix_release_deb }}"

    - name: Install zabbix-agent2
      ansible.builtin.apt:
        name: zabbix-agent2
        state: present
        update_cache: true

    - name: Configure agent (Server, ServerActive, Hostname)
      ansible.builtin.lineinfile:
        path: /etc/zabbix/zabbix_agent2.conf
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^Server=', line: 'Server={{ zabbix_server_ip }}' }
        - { regexp: '^ServerActive=', line: 'ServerActive={{ zabbix_server_ip }}' }
        - { regexp: '^Hostname=', line: 'Hostname={{ inventory_hostname }}' }
      notify: Restart zabbix-agent2

    - name: Enable and start zabbix-agent2
      ansible.builtin.service:
        name: zabbix-agent2
        state: started
        enabled: true

  handlers:
    - name: Restart zabbix-agent2
      ansible.builtin.service:
        name: zabbix-agent2
        state: restarted
